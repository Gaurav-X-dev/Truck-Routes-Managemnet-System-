[project]
name = "truck-route-management-backend"
version = "0.1.0"
description = "Backend for Truck Route Management System"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
