<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#0f0f1a" />
    </linearGradient>
    <linearGradient id="trailer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <g transform="translate(64, 96)">
    <!-- Speed Lines -->
    <line x1="16" y1="112" x2="48" y2="112" stroke="#4b5563" stroke-width="12" stroke-linecap="round"/>
    <line x1="32" y1="160" x2="48" y2="160" stroke="#4b5563" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Trailer -->
    <rect x="64" y="64" width="180" height="144" rx="16" fill="url(#trailer)"/>
    <!-- Trailer details -->
    <rect x="80" y="80" width="148" height="112" rx="8" fill="#ffffff" fill-opacity="0.1"/>
    
    <!-- Cabin -->
    <path d="M260 112 h40 c16 0 24 8 32 24 l20 40 v32 c0 8 -8 16 -16 16 h-76 z" fill="#f8fafc"/>
    <!-- Window -->
    <path d="M268 124 h28 c8 0 12 4 16 12 l12 24 h-56 z" fill="#0f0f1a"/>
    
    <!-- Wheels -->
    <circle cx="120" cy="224" r="32" fill="#0f0f1a"/>
    <circle cx="120" cy="224" r="14" fill="#94a3b8"/>
    <circle cx="288" cy="224" r="32" fill="#0f0f1a"/>
    <circle cx="288" cy="224" r="14" fill="#94a3b8"/>
  </g>
</svg>
